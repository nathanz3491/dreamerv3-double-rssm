defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    # valid_obs emits obs['valid'] (the rule mask's flags), goals_obs the named
    # goals' obs['goalphi'] / obs['goalreach']. survival: only 'none' exists on
    # this branch (no reward shaping); the key stays so the runs'
    # `--env.craftax.survival none` still parses.
    craftax: {logs: False, use_seed: True, valid_obs: False, goals_obs: False, survival: none}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024
    # Not written to disk: the latents cached for replay_context (~90% of a
    # run's disk; see embodied/core/replay.py). [] keeps the stock behaviour.
    save_skip: ['dyn/', 'enc/', 'dec/', 'map/']

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3, feas: 1.0, gphi: 1.0, mpolicy: 1.0, memfut: 1.0, memrec: 1.0, goalvq: 1.0, curio: 1.0}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    # --- the rule mask (needs env.craftax.valid_obs; counted as CHEATING) -----
    # mask: impossible actions get zero probability and zero gradient -- the
    # true flags (obs['valid'], the game's rules) when acting, the learned
    # 'feas' head in imagination, which allows an action above `threshold`.
    # Off by default; next_taste used it.
    valid: {mask: False, threshold: 0.1}
    validhead: {layers: 2, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    # --- two-level agent (docs/agent.md; needs mapmodel.enabled and
    # to_actor). A manager picks one of the goals from RSSM-1's state plus
    # RSSM-2's slow state and holds it until reached or for `hold` steps; the
    # actor sees the goal and is paid goal_reward x the change in its predicted
    # progress plus reach_bonus on reaching it. One critic body with two heads
    # (critic: shared, the only kind on this branch): 'game' judges both
    # actors, 'goal' the bottom actor only, and the manager takes the exact
    # gradient over all goals from the game head. goal_weight weighs the goal
    # stream's NORMALISED advantage against the game stream's 1.0. actent is
    # the manager's entropy bonus. reach_threshold: predicted progress above
    # which an imagined state counts as reached.
    # goals: named -- the 13 tech-tree goals (craftax_goals; needs
    # env.craftax.goals_obs). learned (v2) -- a codebook of `codes` latent-change
    # types (goalcodes.py), learned from changes over code_window steps; a goal
    # counts as reached when the change since it was set is classified as its
    # code (nearest code, cosine above code_reach).
    manager: {enabled: False, goal_reward: 1.0, reach_bonus: 1.0, reach_threshold: 0.6, actent: 1e-3, critic: shared, hold: 32, goal_weight: 0.5, goals: named, codes: 16, code_dim: 64, code_window: 8, code_reach: 0.3, code_beta: 0.25, code_decay: 0.99}
    # --- taste (taste.py; docs/taste-prior.md; ported from ../plastic-reward) --
    # target actions: a per-action logit bias, learned from the critic's
    # advantage on replay at the steps where each action was really taken: the
    # knowledge-free stand-in for valid.mask's rules. The rule constants are the
    # toy's evolved champion (btn2adv). every/fresh: a fold of evidence every
    # 2000 train updates, which is 4000 new env steps at train_ratio 512 with
    # 16x64 batches -- recompute fresh = every * batch_size * batch_length /
    # train_ratio if those change. actions special leaves NOOP, the moves and DO
    # untouched, as the toy's taste covered its buttons but not its moves.
    # target manager moves taste onto the manager's goals instead (named goals):
    # an internal reward on choosing each goal, lam_mgr x its taste relative to
    # the other goals, in rscale units (lam is the actions target's logits and
    # is not used there), learned from the real return after each choice
    # against the manager's expected value; rows caps the decision rows scored
    # per update. lam_mgr 0 is the no-taste control (next_lam0). center
    # compares every slot with the fold's average (False reproduces v2_taste).
    taste: {enabled: False, target: actions, center: False, actions: special, every: 2000, fresh: 4000.0, zscale: 0.288, w0: 0.25, alpha: 0.41, rho: 0.014, pos: 4.45, neg: 1.43, decay: 0.40, lam: 4.92, lam_mgr: 1.0, rows: 256, optimism: 0.0, n0: 20.0, wmax: 1.0, stdrate: 0.01}
    # v2 -- curiosity replaces the reward hints: `members` networks predict the
    # next latent; their disagreement is a third reward stream (weight for the
    # bottom actor, mgr_weight for the manager's goal values). Needs the
    # manager (its shared critic gets an 'explore' head).
    curiosity: {enabled: False, members: 5, layers: 2, units: 512, weight: 0.2, mgr_weight: 0.2}
    memhead: {layers: 2, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in}
    gphihead: {layers: 2, units: 1024, act: silu, norm: rms, output: mse, outscale: 1.0, winit: trunc_normal_in}
    # --- RSSM-2 as memory (mapmodel.py) -------------------------------------
    # A second, slower world model that ticks every `tick` env steps on
    # RSSM-1's mean latent and the window's raw actions. target memory (the
    # only target on this branch; the map target is on family/rssm2) trains it
    # to predict RSSM-1's latent `ahead` ticks on and to recall the observation
    # `back` ticks ago -- no game knowledge. to_actor feeds its state to the
    # actor and critic (and the manager reads it); the manager needs both.
    mapmodel:
      enabled: False
      to_actor: False
      target: memory
      ahead: [1, 2, 4]
      back: [1, 2, 4]
      tick: 8           # env steps per RSSM-2 tick; must divide batch_length
      deter: 1024
      hidden: 512
      layers: 2
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    # 50 was tried and REVERTED: at size50m with imag_last 0 (K = T = 64) it
    # gives 1024 rollouts x 51 steps, compiles fine, enters the training loop and
    # then never completes a single training step. 30 trains normally; 15 is the
    # stock value. Raising this is only safe alongside a smaller imag_last.
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

craftax:
  # Symbolic Craftax at Dreamer's reference operating point (single env, high
  # train_ratio), matching the crafter preset. Apply a size on top, e.g.
  #   --configs craftax size50m
  task: craftax_symbolic
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}
  # Replay lives in HOST RAM, and the default size (5e6) never evicts inside a
  # 1.1M-step run -- so peak memory would be the whole run (~33KB a step with
  # the 8268-dim observation and replay_context). The cap of 400k steps
  # (~13-19GB) was set for the larger family runs and every scored run used
  # it, the plain baselines included, so it stays: changing it changes which
  # steps are replayed after 400k.
  replay: {size: 4e5}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
